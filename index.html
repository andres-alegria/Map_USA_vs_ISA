<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US deep-sea mining applications and the ISA</title>

  <!-- fonts: Public Sans for text, Rowan for the title (swap here) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=rowan@400&display=swap">

  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="panel" aria-label="About this map">
      <h1 class="title" id="title"></h1>
      <p class="deck" id="deck"></p>

      <fieldset class="layers">
        <legend class="layers-heading" id="layers-heading"></legend>
        <div id="layer-list"></div>
      </fieldset>

      <p class="hint" id="hint"></p>
    </aside>

    <main class="map-wrap">
      <div id="map" aria-label="Map of US and ISA seabed mining areas in the Clarion-Clipperton Zone"></div>
    </main>

    <footer class="foot">
      <p id="sources"></p>
      <p id="credit"></p>
    </footer>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.0/mapbox-gl.js"></script>
  <!-- local token file, not committed; see README.md -->
  <script src="js/mapbox-token.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
